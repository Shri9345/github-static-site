
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>
  <nav>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
    <ul class="nav-links" id="navLinks">
      <li><a href="#projects">Projects</a></li>
      <li><a href="#about">About</a></li>
    </ul>
  </nav>

  <header>
    <h1>Welcome to My Portfolio</h1>
    <a href="assets/resume.pdf" download class="btn">Download Resume</a>
  </header>

  <section id="projects">
    <h2>Projects</h2>
    <div class="project-card" data-aos="fade-up">
      <img src="assets/project1.png" alt="Project Screenshot" class="project-img">
      <h3>Static Website</h3>
      <p>Simple site hosted on GitHub Pages using HTML & CSS.</p>
      <div class="links">
        <a href="https://shri9345.github.io/github-static-site/" target="_blank">
          <img src="assets/external-link.svg" alt="Live Site">
        </a>
        <a href="https://github.com/Shri9345/github-static-site" target="_blank">
          <img src="assets/github.svg" alt="GitHub">
        </a>
      </div>
    </div>
  </section>

  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, easing: "ease-in-out", once: true });
    function toggleMenu() {
      const nav = document.getElementById("navLinks");
      nav.classList.toggle("show");
    }
  </script>
</body>
</html>
